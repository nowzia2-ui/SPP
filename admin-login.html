<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Student Placement Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>🎓 Student Placement Portal</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="companies.html">Companies</a>
        <a href="drives.html">Drives</a>
    </nav>
</header>

<section class="login-container">

    <div class="login-card">

        <div class="login-icon">
            👨‍💼
        </div>

        <h1>Admin Login</h1>

        <p class="login-subtitle">
            Placement Officer access
        </p>

        <form onsubmit="adminLogin(event)">

            <label>Admin Username</label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter admin username"
            >

            <label>Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
            >

            <button type="submit">
                Login as Admin
            </button>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 Student Placement Portal</p>
</footer>

<script>

function adminLogin(event) {

    event.preventDefault();

    let username =
        document.getElementById("adminUsername").value;

    let password =
        document.getElementById("adminPassword").value;

    if (username === "admin" && password === "admin123") {

        localStorage.setItem("adminLoggedIn", "true");
        localStorage.removeItem("loggedIn");

        window.location.href = "admin.html";

    } else {

        alert("Invalid admin username or password.");

    }
}

function updateNavigation() {

    let authLinks = document.getElementById("authLinks");

    if (localStorage.getItem("loggedIn") === "true") {

        authLinks.innerHTML = `
            <a href="dashboard.html">Dashboard</a>
            <a href="applications.html">My Applications</a>
            <a href="profile.html">My Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        `;

    } else if (localStorage.getItem("adminLoggedIn") === "true") {

        authLinks.innerHTML = `
            <a href="admin.html">Admin Dashboard</a>
            <a href="#" onclick="adminLogout()">Logout</a>
        `;

    } else {

        authLinks.innerHTML = `
            <a href="login.html">Login</a>
            <a href="admin-login.html">Admin</a>
        `;
    }
}

function adminLogout() {

    localStorage.removeItem("adminLoggedIn");

    alert("Admin logged out successfully.");

    window.location.href = "index.html";
}

updateNavigation();

</script>

</body>
</html>
