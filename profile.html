<!DOCTYPE html>
<html>

<head>
    <title>My Profile - Student Placement Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>🎓 Student Placement Portal</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="companies.html">Companies</a>
        <a href="drives.html">Drives</a>

        <span id="authLinks"></span>
        
    </nav>
</header>

<section class="profile-page">

    <div class="profile-card">

        <div class="profile-icon">
            👤
        </div>

        <h1>My Profile</h1>
        <p class="profile-subtitle">
            Manage your placement profile
        </p>

        <form onsubmit="saveProfile(event)">

            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>College</label>
            <input
                type="text"
                id="college"
                placeholder="Enter your college name"
                required
            >

            <label>Branch</label>
            <input
                type="text"
                id="branch"
                placeholder="Example: Computer Science and Engineering"
                required
            >

            <label>CGPA</label>
            <input
                type="number"
                id="cgpa"
                placeholder="Enter your CGPA"
                step="0.01"
                min="0"
                max="10"
                required
            >

            <label>Skills</label>
            <input
                type="text"
                id="skills"
                placeholder="Example: Java, SQL, HTML, CSS"
                required
            >

            <label>Resume</label>

                <input
                    type="file"
                    id="resume"
                    accept=".pdf"
                >

                <p id="resumeName" class="resume-name">
                    No resume selected
                </p>

            <button type="submit" class="save-button">
                Save Profile
            </button>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 Student Placement Portal</p>
</footer>

<script>

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}


function logout() {

    localStorage.removeItem("loggedIn");

    alert("You have been logged out successfully.");

    window.location.href = "index.html";
}

function updateNavigation() {
    let authLinks = document.getElementById("authLinks");

    let currentPage = window.location.pathname.split("/").pop();

    if (localStorage.getItem("loggedIn") === "true") {
        authLinks.innerHTML = `
            <a href="dashboard.html" class="${currentPage === 'dashboard.html' ? 'active' : ''}">Dashboard</a>
            <a href="applications.html" class="${currentPage === 'applications.html' ? 'active' : ''}">My Applications</a>
            <a href="profile.html" class="${currentPage === 'profile.html' ? 'active' : ''}">My Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        `;
    } else if (localStorage.getItem("adminLoggedIn") === "true") {
        authLinks.innerHTML = `
            <a href="admin.html" class="${currentPage === 'admin.html' ? 'active' : ''}">Admin Dashboard</a>
            <a href="#" onclick="adminLogout()">Logout</a>
        `;
    } else {
        authLinks.innerHTML = `
            <a href="login.html" class="${currentPage === 'login.html' ? 'active' : ''}">Login</a>
            <a href="admin-login.html" class="${currentPage === 'admin-login.html' ? 'active' : ''}">Admin</a>
        `;
    }
}

function adminLogout() {

    localStorage.removeItem("adminLoggedIn");

    alert("Admin logged out successfully.");

    window.location.href = "index.html";
}

updateNavigation();


function saveProfile(event) {

    event.preventDefault();

    let profile = {

        name: document.getElementById("name").value,

        email: document.getElementById("email").value,

        college: document.getElementById("college").value,

        branch: document.getElementById("branch").value,

        cgpa: document.getElementById("cgpa").value,

        skills: document.getElementById("skills").value
    };

    localStorage.setItem(
        "studentProfile",
        JSON.stringify(profile)
    );

    alert("Profile saved successfully!");

}


function loadProfile() {

    let profile =
        JSON.parse(localStorage.getItem("studentProfile"));

    if (profile) {

        document.getElementById("name").value = profile.name;
        document.getElementById("email").value = profile.email;
        document.getElementById("college").value = profile.college;
        document.getElementById("branch").value = profile.branch;
        document.getElementById("cgpa").value = profile.cgpa;
        document.getElementById("skills").value = profile.skills;
    }
}

loadProfile();

</script>

</body>
</html>
